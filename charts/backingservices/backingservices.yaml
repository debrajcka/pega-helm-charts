apiVersion: apps/v1
kind: Deployment
metadata:
  name: pega-srs
  namespace: pegabackingservices
  labels:
    helm.sh/chart: srs-0.1.0
    app.kubernetes.io/name: srs
    app.kubernetes.io/instance: backingservices
    app.kubernetes.io/version: "1.7.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: srs-service
      app.kubernetes.io/instance: backingservices

  template:
    metadata:
      labels:
        app.kubernetes.io/name: srs-service
        app.kubernetes.io/instance: backingservices

    spec:
      imagePullSecrets:
        - name: pega-srs-reg-secret
        - name: dockercred
      containers:
        - name: srs-service
          image: debrajbhowmik/pega2421:search-n-reporting-service-os-1.37.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: srs-port
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: srs-port
              scheme: HTTP
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 30
          env:
            - name: ELASTICSEARCH_HOST
              value: elasticsearch-master.pegabackingservices.svc
            - name: ELASTICSEARCH_PORT
              value: "9200"
            - name: ELASTICSEARCH_PROTO
              value:  "http"
            - name: ELASTICSEARCH_AUTH_PROVIDER
              value: basic-authentication
            - name: ELASTICSEARCH_USERNAME
              valueFrom:
               secretKeyRef:
                  name: "srs-elastic-credentials"
                  key: username
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "srs-elastic-credentials"
                  key: password
            - name: APPLICATION_HOST
              value: "0.0.0.0"
            - name: APPLICATION_PORT
              value: "8080"
            - name: AUTH_ENABLED
              value: "false"
            - name: OAUTH_PUBLIC_KEY_URL
              value:
            - name: PUBLIC_KEY_URL
              value: ""
            - name: HIGH_SECURE_CRYPTO_MODE_ENABLED
              value: "false"
            - name: JAVA_OPTS
              value:
          resources:
            limits:
              cpu: 1300m
              memory: 4Gi
            requests:
              cpu: 650m
              memory: 4Gi
      initContainers:
      - name: wait-for-internal-es-cluster
        image: alpine:3.20.2
        imagePullPolicy: IfNotPresent
        args:
          - until $(wget -q -S --spider --timeout=2 -O /dev/null $ELASTICSEARCH_PROTO://$ELASTICSEARCH_USERNAME:$ELASTICSEARCH_PASSWORD@$ELASTICSEARCH_HOST:$ELASTICSEARCH_PORT ); do nslookup -type=ns $ELASTICSEARCH_HOST && echo Waiting for Elasticsearch cluster to become live...; sleep 10; done;
        command:
          - sh
          - -c

        env:
          - name: ELASTICSEARCH_PROTO
            value: "http"
          - name: ELASTICSEARCH_HOST
            value: elasticsearch-master.pegabackingservices.svc
          - name: ELASTICSEARCH_PORT
            value: "9200"
          - name: ELASTICSEARCH_USERNAME
            valueFrom:
              secretKeyRef:
                name: srs-elastic-credentials
                key: username
          - name: ELASTICSEARCH_PASSWORD
            valueFrom:
              secretKeyRef:
                name: srs-elastic-credentials
                key: password
